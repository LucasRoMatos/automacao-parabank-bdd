name: Testes BDD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080

    env:
      PARABANK_URL: http://localhost:8080/parabank

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Aguardar ParaBank
        shell: bash
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/parabank/index.htm > /dev/null; then
              echo "ParaBank no ar"
              exit 0
            fi
            sleep 5
          done
          echo "ParaBank não respondeu"
          exit 1

      - name: Executar testes
        shell: bash
        run: |
          mkdir -p evidencias
          python -m behave | tee evidencias/execucao.txt

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: evidencias/